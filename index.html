<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criadoras em Pauta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
:root{--cream:#FBF9F4;--ink:#0F0F0F;--ink2:#606060;--line:#DDDDDD;--red:#FF0000;--red-soft:#FFE5E5}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Roboto",Arial,sans-serif;font-size:17px;line-height:1.55}
.in{max-width:880px;margin:0 auto;padding:64px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;position:relative}
body::after{content:"";position:fixed;right:-180px;top:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,0,0,.14),rgba(0,0,0,0) 65%);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-size:.84rem;font-weight:700;width:fit-content;background:var(--red-soft);color:#CC0000}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
h1{margin:0;font-weight:900;font-size:clamp(2.6rem,10vw,4.5rem);line-height:1.02;letter-spacing:-.02em}
h1 span,.r{color:var(--red)}
p{margin:0;color:var(--ink2);max-width:46ch}
.kick{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-top:24px}
ul{list-style:none;margin:0;padding:0}
li a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
li a b{font-size:1.15rem;font-weight:900;display:block}
li a small{color:var(--ink2)}
li a::after{content:"→";color:var(--red);font-weight:900;font-size:1.3rem}
li a:hover b{color:var(--red)}
a:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
<div class="in">
  <span class="pill">Newsletter semanal</span>
  <h1>Criadoras<br><span>em Pauta</span></h1>
  <p>As dicas da semana do Programa de Aceleração de Criadoras do YouTube Brasil, num lugar só, para explorar no seu tempo.</p>
  <span class="kick">Edições</span>
  <ul>
    <li><a href="edicoes/1/"><span><b>Edição #1</b><small>Trailer, gancho, Estreia ou Live e links úteis</small></span></a></li>
  </ul>
</div>
</body>
</html>
